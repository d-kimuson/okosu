name: Okosu
options:
  bundleIdPrefix: com.okosu

# NOTE: KeyboardShortcuts は Sources/Okosu/Vendor に同梱（MIT）。
# SPM 経由だと Xcode 26 の Ld 呼び出しが壊れるため直接取り込んでいる。
# 詳細は docs/HANDOVER.md。

targets:
  Okosu:
    type: application
    platform: macOS
    bundleId: com.okosu.app
    sources:
      - Sources/Okosu
    # dependencies: なし（Vendor 同梱のため）
    settings:
      base:
        # whisper-stream 同梱物が arm64 のみのため (README 参照)。
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "音声入力の文字起こしのためにマイクを使用します"
        INFOPLIST_KEY_CFBundleDisplayName: Okosu
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  Okosu:
    build:
      targets:
        Okosu: all
    run:
      config: Debug
